apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hermes-forecast
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: hermes-forecast/web:latest
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://api:8000/api/v1
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hermes-forecast
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
